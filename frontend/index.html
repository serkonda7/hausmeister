<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316a34a'/%3E%3Cpath d='M16 6.5 25 14.5h-2.8v10h-4.4v-6h-3.6v6H9.8v-10H7z' fill='white'/%3E%3C/svg%3E"
    >
    <title>Hausmeister – Finance</title>
    <meta name="color-scheme" content="light dark">
    <style>
    html[data-theme="light"] body {
      background: #f9fafb;
      color: #111827;
    }
    html[data-theme="dark"] body {
      background: #0f1115;
      color: #e5e7eb;
    }
    </style>
    <script>
    // Set the theme before first paint to avoid a flash of the wrong theme
    try {
      const stored = localStorage.getItem('theme')
      const initialTheme =
        stored === 'dark' || stored === 'light'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
      document.documentElement.dataset.theme = initialTheme
      document.documentElement.style.colorScheme = initialTheme
    } catch {
      // ignore
    }
    </script>
  </head>

  <body>
    <noscript> JavaScript must be enabled to run this app. </noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
