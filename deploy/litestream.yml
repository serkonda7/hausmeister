# Continuous SQLite replication to Backblaze B2 (S3-compatible API).
# Credentials and bucket come from .env.backup.
#
# B2 has free tier cap for Class C transactions of 2,500/day.
# Litestream by default easily does 100k+ list calls a day.
# Therefore, the intervals are prolonged while still having 15 min RPO.
levels: # compaction; defaults are 30s / 5m / 1h
  - interval: 5m
  - interval: 1h
  - interval: 24h
l0-retention: 1h # default 5m
l0-retention-check-interval: 1h # default 15s
sync-interval: 15m # default 1s

dbs:
  - path: /data/db/app.sqlite
    replica:
      type: s3
      bucket: ${S3_BUCKET}
      path: litestream/app.sqlite
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access-key-id: ${S3_ACCESS_KEY_ID}
      secret-access-key: ${S3_SECRET_ACCESS_KEY}
      force-path-style: true
