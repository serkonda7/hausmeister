# Hausmeister production stack. Run from /opt/hausmeister/deploy.
# Nothing here publishes a host port: Caddy lives in the Tailscale netns.
# No public domain: the app runs at the node's MagicDNS name (DOMAIN in .env).
name: hausmeister

services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: hausmeister
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-} # one-off key, tagged tag:hausmeister; only needed on first start
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false" # kernel TUN (needs /dev/net/tun)
      TS_EXTRA_ARGS: --advertise-tags=tag:hausmeister
      TS_SOCKET: /var/run/tailscale/tailscaled.sock # shared with Caddy for the HTTPS certificate
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ts_socket:/var/run/tailscale
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9
    network_mode: service:tailscale # listens on the tailnet only
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (hausmeister.<tailnet>.ts.net)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ts_socket:/var/run/tailscale # tailscaled's LocalAPI: certificates for *.ts.net
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [tailscale, app]
    restart: unless-stopped

  app:
    build: ..
    image: hausmeister-app:${APP_VERSION:-dev}
    environment:
      ORIGIN: https://${DOMAIN}
      DATABASE_PATH: /data/db/app.sqlite
      UPLOAD_DIR: /data/uploads
      BETTER_AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      ISBN_LOOKUP: ${ISBN_LOOKUP:-on}
    volumes: ["./data:/data"]
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.5.18
    command: replicate -config /etc/litestream.yml
    volumes:
      - ./data/db:/data/db
      - ./litestream.yml:/etc/litestream.yml:ro
    env_file: .env.backup
    depends_on: [app]
    restart: unless-stopped

  # One-shot: `docker compose run --rm restic <args>` (used by backup-uploads.sh)
  restic:
    image: restic/restic:0.19.1
    profiles: [tools]
    env_file: .env.backup
    volumes:
      - ./data/uploads:/data/uploads:ro
      - restic_cache:/root/.cache/restic
    hostname: hausmeister

volumes:
  ts_socket: {}
  caddy_data: {}
  caddy_config: {}
  restic_cache: {}
