services:
  hausmeister:
    build:
      context: .
      dockerfile: infra/Dockerfile
    # The backend binds 127.0.0.1:3001; host networking keeps it loopback-only on the host.
    network_mode: host
    # Same location as in development: backend/data/hausmeister.db
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    # Host network to reach the backend on loopback; serves :80/:443 with automatic HTTPS.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. books.example.com}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # One-shot job, not started by `up`: docker compose run --rm backup
  backup:
    profiles: ["backup"]
    build: infra/backup
    env_file: infra/backup/.env
    volumes:
      - ./backend/data:/data
    # The SQLite WAL index (-shm) is shared memory, so the volume must be writable.

volumes:
  caddy_data:
  caddy_config:
